name: Windows Setup

# 언제 도나
#   · main 에 데스크톱 셸이 바뀌었을 때 (설치 파일이 만들어지는지 확인)
#   · 손으로 돌릴 때
#   · v* 태그를 밀 때 — 그때만 릴리스에 BookReaderSetup.exe 를 붙인다
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      site_url:
        description: '프로그램이 열 사이트 주소 (비우면 기본 배포본)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 의존성 설치
        working-directory: desktop
        run: npm install

      - name: 설치 파일 빌드
        working-directory: desktop
        env:
          DESKTOP_SITE_URL: ${{ github.event.inputs.site_url }}
          # 서명하지 않는다. 서명서가 없으면 electron-builder 가 멈추지 않게 명시한다.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: 산출물 확인
        id: setup
        shell: bash
        run: |
          set -e
          EXE="desktop/dist/BookReaderSetup.exe"
          test -f "$EXE" || { echo "::error::$EXE 가 만들어지지 않았다"; ls -la desktop/dist || true; exit 1; }
          SIZE=$(stat -c%s "$EXE")
          # 빌드가 통과해도 껍데기만 나오는 경우가 있다. 크기로 한 번 더 막는다.
          test "$SIZE" -gt 40000000 || { echo "::error::설치 파일이 너무 작다 ($SIZE bytes)"; exit 1; }
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "BookReaderSetup.exe — $((SIZE/1024/1024)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: BookReaderSetup
          path: ${{ steps.setup.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: 태그면 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.setup.outputs.path }}
          body: |
            **BookReaderSetup.exe** — 윈도우 설치 파일입니다.

            서명하지 않은 설치 파일이라 실행할 때 SmartScreen 경고가 뜹니다.
            「추가 정보」 → 「실행」으로 진행하시면 됩니다.

            프로그램은 배포된 사이트를 여는 창이라, 웹을 고치면
            다시 설치하지 않아도 반영됩니다.
